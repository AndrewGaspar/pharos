; aco-dlss configuration. Re-read about once a second while the game runs (except render_scale).
[upscaler]
enabled=1
; dlss | bilinear
backend=dlss
; DLSS render preset: M (DLSS 4.5, performance), L (DLSS 4.5, ultra performance), K (DLSS 4 transformer)
preset=M
; none | motion | depth
debug=none
; sign/scale multipliers for the engine's jitter and motion vectors
jitter_x=1
jitter_y=1
mv_x=1
mv_y=1
; >0 writes PixelDensity into ACO.ini at startup (0.5 = performance, 0.58 = balanced, 0.667 = quality, 1 = DLAA)
render_scale=0
; texture LOD bias: auto = log2(render/display) + mip_bias_offset
mip_bias=auto
mip_bias_offset=0
; 1 = write latency_taa.csv / latency_present.csv to the log dir (input latency measurement)
latency_log=0

; key that switches between DLSS and the game's own TAA while playing (F1..F24, or none)
toggle_key=F10

[reflex]
; NVIDIA Reflex low-latency mode: off | on | boost (on + keep GPU clocks high)
mode=on
; >0 caps the frame rate through Reflex (e.g. 160 on a 165 Hz display with VRR)
fps_limit=0
; 1 = delimit frames for the driver with latency markers (0 = markerless; costs throughput when CPU-bound)
markers=1
; experiments: marker_set=minimal|full, optimize=0|1 (bUseMarkersToOptimize)
marker_set=minimal
optimize=0
; 1 = log which threads read input (diagnostics)
probe=0

[fg]
; DLSS Frame Generation: off | d3d12 (NGX D3D12 on a vkd3d-proton device, shared textures with
; DXVK) | on (NGX Vulkan on DXVK's device: runs but never generates, kept for research)
mode=d3d12
; mode=d3d12: Frame Generation on at start (the hotkey below flips it live)
enabled=1
; hotkey: Frame Generation on/off in game (F1..F24 or none); mode=d3d12 stays set up while off
toggle_key=F9
; motion vector normalisation (our vectors are in UV units)
mv_scale=1
; units DLSS-G is told the motion vectors are in: uv (MvecScale = mv_scale) | px (mv_scale x render size)
mv_units=px
; camera data for DLSS-G: engine (the game's projection, view and previous-frame matrices, read from the
; TAA pass's constant buffers) | identity (identity matrices and a synthetic camera)
camera=engine
; camera=engine: 1 = remove the TAA jitter from the projection (DLSS-G wants unjittered matrices)
camera_unjitter=1
; 1 = present the real frame half a frame after the generated one (smooth); 0 = back to back
pacing=1
; when the generated frame is presented: ready (as soon as DLSS-G is done; the original) | smooth (default: not sooner than half
; an interval after the previous real frame, catching up by pace_relax of the difference) | arrival (at a
; fixed lag after the game's Present)
pace=smooth
pace_relax=0.5
; debug: both | generated | real (present only one kind of frame, for screenshots)
show=both
; debug: 1 = create the generated-frame texture magenta (read at texture creation)
debug_fill=0
; debug: 1 = NGX log into aco_dlss.log, 2 = verbose (read at NGX init)
ngx_log=0
; 1 = pass the backbuffer format to DLSS-G as a DXGI value instead of a VkFormat
bb_format_dxgi=0
; experiments: extra unsigned DLSS-G eval parameters, e.g. extra=DLSSG.TargetFrameRate:120,DLSSG.RefreshRate:165
extra=
; backbuffer input for DLSS-G: swapchain (the rotating swapchain image) | copy (our copy)
input=swapchain
; debug: 1 = swap the textures given as OutputInterpolated / OutputReal
swap_outputs=0
; 1 = pass the DLSS output (scene before the UI composite) as HUD-less colour
hudless=1
; display refresh rate passed to DLSS-G (0 = not set)
refresh_hz=165
; DLSS-G MultiFrameCount: generated frames evaluated per real frame (mode=d3d12: 1 = standard 2x,
; verified; 2 also generates but only index show_index is presented, at twice the GPU cost)
count=1
; which generated index to present (1..count)
show_index=1
; debug: 1 = DLSS-G writes a Vulkan image we create ourselves (read back and logged)
raw_output=0
; debug: 1 = log how NGX creates/launches its CUDA kernels (read at NGX init)
trace_cu=0
; experiment: 1 = hide vkGetImageViewHandle64NVX/AddressNVX from DLSS-G. Its evaluation then fails
; (PlatformError: it requires 64-bit image view handles), so keep 0.
hide_handle64=0
; experiments: extra unsigned create-time parameters, e.g. create_extra=DLSSG.UserInterfaceRecompositionEnabled:0
create_extra=
; mode=d3d12: 1 = run our vkd3d-proton device in descriptor-heap mode (DLSS-G needs CUDA descriptors
; for raw buffer UAVs, which the default descriptor-buffer mode cannot give)
descriptor_heap=1
; debug (mode=d3d12): 1 = every 2 s log how the generated frame differs from the real frames before
; and after it, and write the three to out/fgverify/*.ppm
verify=0
; debug: `touch <out>/fgtrace-start` records the next trace_presents presents (timestamps) and a band of the
; image of the first trace_shots of them into <out>/fgtrace/ (tools/fg-trace, tools/fg-pacing.py)
trace_presents=1200
trace_shots=120
; mode=d3d12: 1 = the game renders into a backbuffer of ours and a present thread shows the real frame
; half a frame after the generated one (no stall of the render thread); 0 = both presents inline
; (the pacing wait then stalls the game). Read at swapchain creation.
present_thread=1
; present_thread=1: 1 = while the present thread copies + presents, the game's render thread waits at
; its next context call (DXVK's context lock is an unfair spinlock: without this the present thread
; starves for most of a frame at high resolution)
present_gate=1
; mode=d3d12: how the generated frame is handed back to D3D11. cpu = the present thread waits on the CPU
; for the D3D12 fence before copying it out, and the D3D11 queue never waits for D3D12 (two texture
; sets alternate). gpu = a D3D11 queue wait on the shared fence right after submitting: vkd3d-proton
; resolves waits on shared fences on the CPU in its submission thread, so the D3D11 queue then stalls
; on a CPU round trip every frame (halves the frame rate at 2560x1600).
sync=cpu
; mode=d3d12: DXGI maximum frame latency while FG runs (0 = keep the game's). DXVK makes each Present
; wait until the present this many presents back is done; FG presents twice per game frame.
frame_latency=0
; mode=d3d12: minimum swapchain buffer count (0 = the game's; DXVK caps the frame latency by it)
buffers=0
; bisecting (mode=d3d12): eval = everything but the DLSS-G evaluation, d3d12 = no D3D12 work or fences,
; present2 = only the first (generated) present
skip=

[cloth]
; Cloth simulation rate. game = engine default (fixed steps: 60 Hz near, 40/30/20 Hz for lower cloth
; LODs, not interpolated). render = every cloth advances at least once per rendered frame
; (never slower than the engine default; costs CPU in crowds). scale = multiply the engine intervals
; by `scale` (diagnostics). v1.62 only; the table is verified before patching.
mode=game
scale=1

[world]
; Draw distance multiplier for world geometry: objects stay drawn (at their detailed LODs) and are
; culled this many times further out (1 = game default, 2 = twice as far). LOD/proxy switch-in
; distances stay at the game's values, so nothing disappears before its replacement has streamed in.
lod_distance=1
; far = extend only the far end of LOD ranges (patched culling shaders; default). all = old behaviour,
; every range scaled (makes far proxies vanish near the camera, e.g. Alexandria's street planters).
lod_mode=far

; Ambient population: multiplies the engine's cap on systemically spawned characters (civilians,
; workers, animals; 200 in the game data, times 0.75-1.2 by Environment quality). Towns and cities
; normally sit at that cap. 1 = game default; 3-5 lifts the cap out of the way (~1.7x crowds in
; Alexandria; the rest is limited by spawn distance, see npc_distance). Game data only, nothing is
; saved; takes effect live within ~1 minute.
npc_density=1
; Spawn distance multiplier for ambient characters (MetaAI activation range and the spawn/despawn
; distance of the crowd spawn templates, 80 m in the game data). More of the city around you is
; populated, so the population rises further once npc_density has lifted the cap: in Alexandria
; npc_density=5 + npc_distance=2 gave ~2.6-3x the game's crowd. Rescans the game's data every
; 10 s in a background thread while active. Experimental: see docs/ENGINE_NOTES.md (NPC population).
npc_distance=1
; EXPERIMENT (default off): extra MetaAI units, i.e. more people near you rather than a higher cap.
; k = units per original unit in each civilian spawner the player approaches (1 = off, max 16).
; Calls the game's own unit-creation code from its MetaAI update; see src/world/npc_units.h.
npc_units=1
