; Pharos configuration. Re-read about once a second while the game runs (except render_scale).
[upscaler]
enabled=1
; dlss | bilinear
backend=dlss
; DLSS render preset: M (DLSS 4.5, performance), L (DLSS 4.5, ultra performance), K (DLSS 4 transformer)
preset=M
; none | motion | depth
debug=none
; sign/scale multipliers for the engine's jitter and motion vectors
jitter_x=1
jitter_y=1
mv_x=1
mv_y=1
; >0 writes PixelDensity into ACO.ini at startup (0.5 = performance, 0.58 = balanced, 0.667 = quality, 1 = DLAA)
render_scale=0
; texture LOD bias: auto = log2(render/display) + mip_bias_offset
mip_bias=auto
mip_bias_offset=0
; 1 = write latency_taa.csv / latency_present.csv to the log dir (input latency measurement)
latency_log=0

; key that switches between DLSS and the game's own TAA while playing (F1..F24, or none)
toggle_key=F10

[reflex]
; NVIDIA Reflex low-latency mode: off | on | boost (on + keep GPU clocks high)
mode=on
; >0 caps the (real) frame rate (e.g. 160 on a 165 Hz display with VRR). With Frame Generation, a
; cap a little below what the GPU can sustain keeps the game's frame cadence steady (see
; docs/FRAME_GENERATION.md, "Game cadence under Frame Generation").
fps_limit=0
; how fps_limit (and Frame Generation's automatic cap) is enforced: auto (cpu while Frame Generation
; runs, else driver) | driver (Reflex's minimum frame interval; needs mode=on) | cpu (the mod waits on
; the render thread after Present; works with Reflex off too). auto because under Frame Generation
; DXVK's Reflex frame tracking (GE-Proton11-12) drops the markers and the driver's cap stops holding.
limiter=auto
; 1 = delimit frames for the driver with latency markers (0 = markerless; costs throughput when CPU-bound)
markers=1
; experiments: marker_set=minimal|full, optimize=0|1 (bUseMarkersToOptimize)
marker_set=minimal
optimize=0
; 1 = log which threads read input (diagnostics)
probe=0

[fg]
; DLSS Frame Generation: off | d3d12 (NGX D3D12 on a vkd3d-proton device, shared textures with
; DXVK) | on (NGX Vulkan on DXVK's device: runs but never generates, kept for research)
mode=d3d12
; mode=d3d12: Frame Generation on at start (the hotkey below flips it live)
enabled=1
; hotkey: Frame Generation on/off in game (F1..F24 or none); mode=d3d12 stays set up while off
toggle_key=F9
; motion vector normalisation (our vectors are in UV units)
mv_scale=1
; units DLSS-G is told the motion vectors are in: uv (MvecScale = mv_scale) | px (mv_scale x render size)
mv_units=px
; camera data for DLSS-G: engine (the game's projection, view and previous-frame matrices, read from the
; TAA pass's constant buffers) | identity (identity matrices and a synthetic camera)
camera=engine
; camera=engine: 1 = remove the TAA jitter from the projection (DLSS-G wants unjittered matrices)
camera_unjitter=1
; 1 = present the real frame half a frame after the generated one (smooth); 0 = back to back
pacing=1
; when the generated frame is presented: content (both presents on the game's own timeline: real frame a fixed lag after
; the game's Present, generated frame half the *actual* frame interval before it; best with VRR) | ready (as soon as DLSS-G is done; the original) | smooth (not sooner than half
; an interval after the previous real frame, catching up by pace_relax of the difference) | arrival (at a
; fixed lag after the game's Present)
pace=smooth
pace_relax=0.5
; 1 = cap the real frame rate automatically with headroom while Frame Generation runs (enforced by the
; [reflex] limiter; an explicit [reflex] fps_limit wins). Keeps the game's frame cadence steady and DLSS-G
; within a frame of the game's Present. auto_cap_lag: target (frames); auto_cap_min/max: bounds in fps.
auto_cap=1
auto_cap_lag=0.7
; which "DLSS-G done" auto_cap_lag measures: ready (when the present thread has the first generated frame:
; includes waiting for the previous frame's presents) | gpu (when DLSS-G finished on the GPU)
auto_cap_lag_from=ready
auto_cap_min=0
auto_cap_max=0
; texture sets in flight: 2 | 3 (the present thread may run two frames behind before the game waits)
sets=2
; done_fence: fence the CPU waits for DLSS-G completion use: shared (the one D3D11 also opens) | private
; (a plain D3D12 fence signalled at the same point). Diagnostic; reloaded live.
done_fence=shared
; ts_guard: 1 = before showing a generated frame, also wait (up to 50 ms) until DLSS-G's end-of-work
; GPU timestamp has been written. The perf log line "completion check" counts frames where the fence
; said done before that timestamp existed.
ts_guard=1
; debug: both | generated | real (present only one kind of frame, for screenshots)
show=both
; debug: 1 = create the generated-frame texture magenta (read at texture creation)
debug_fill=0
; debug: 1 = NGX log into pharos.log, 2 = verbose (read at NGX init)
ngx_log=0
; 1 = pass the backbuffer format to DLSS-G as a DXGI value instead of a VkFormat
bb_format_dxgi=0
; experiments: extra unsigned DLSS-G eval parameters, e.g. extra=DLSSG.TargetFrameRate:120,DLSSG.RefreshRate:165
extra=
; backbuffer input for DLSS-G: swapchain (the rotating swapchain image) | copy (our copy)
input=swapchain
; debug: 1 = swap the textures given as OutputInterpolated / OutputReal
swap_outputs=0
; 1 = pass the DLSS output (scene before the UI composite) as HUD-less colour
hudless=1
; display refresh rate in Hz, passed to DLSS-G and the default Multi Frame Generation target
; (0 = detect: the swapchain's fullscreen mode, else the display mode)
refresh_hz=0
; Frame Generation multiplier: frames presented per real frame. 2 = one generated frame (2x) .. 6 = five
; (6x; DLSS Multi Frame Generation, RTX 50: up to DLSSG.MultiFrameCountMax + 1, logged at start).
; auto = dynamic: the smallest multiplier in [count_min, count_max] that reaches target_hz with the
; real frame rate the automatic cap can hold. (count=1 in older inis means 2x.) Reloaded live.
count=2
count_min=2
count_max=4
; presents per second to aim for (0 = refresh_hz / the detected refresh): with auto_cap the real frame
; rate is capped at target_hz / multiplier (e.g. 165 Hz: 82.5 at 2x, 55 at 3x, 41.25 at 4x), so with VRR
; every refresh shows one frame at an even cadence
target_hz=0
; debug: 1 = DLSS-G writes a Vulkan image we create ourselves (read back and logged)
raw_output=0
; debug: 1 = log how NGX creates/launches its CUDA kernels (read at NGX init)
trace_cu=0
; experiment: 1 = hide vkGetImageViewHandle64NVX/AddressNVX from DLSS-G. Its evaluation then fails
; (PlatformError: it requires 64-bit image view handles), so keep 0.
hide_handle64=0
; experiments: extra unsigned create-time parameters, e.g. create_extra=DLSSG.UserInterfaceRecompositionEnabled:0
create_extra=
; mode=d3d12: 1 = run our vkd3d-proton device in descriptor-heap mode (DLSS-G needs CUDA descriptors
; for raw buffer UAVs, which the default descriptor-buffer mode cannot give)
descriptor_heap=1
; debug (mode=d3d12): 1 = every 2 s log how the generated frame differs from the real frames before
; and after it, and write the three to out/fgverify/*.ppm
verify=0
; debug: `touch <out>/fgtrace-start` records the next trace_presents presents (timestamps) and a band of the
; image of the first trace_shots of them into <out>/fgtrace/ (tools/fg-trace, tools/fg-pacing.py)
trace_presents=1200
trace_shots=120
; mode=d3d12: 1 = the game renders into a backbuffer of ours and a present thread shows the real frame
; half a frame after the generated one (no stall of the render thread); 0 = both presents inline
; (the pacing wait then stalls the game). Read at swapchain creation.
present_thread=1
; present_thread=1: 1 = while the present thread copies + presents, the game's render thread waits at
; its next context call (DXVK's context lock is an unfair spinlock: without this the present thread
; starves for most of a frame at high resolution)
present_gate=1
; mode=d3d12: how the generated frame is handed back to D3D11. cpu = the present thread waits on the CPU
; for the D3D12 fence before copying it out, and the D3D11 queue never waits for D3D12 (two texture
; sets alternate). gpu = a D3D11 queue wait on the shared fence right after submitting: vkd3d-proton
; resolves waits on shared fences on the CPU in its submission thread, so the D3D11 queue then stalls
; on a CPU round trip every frame (halves the frame rate at 2560x1600).
sync=cpu
; mode=d3d12: DXGI maximum frame latency while FG runs (0 = keep the game's). DXVK makes each Present
; wait until the present this many presents back is done; FG presents twice per game frame.
frame_latency=0
; mode=d3d12: minimum swapchain buffer count (0 = the game's; DXVK caps the frame latency by it)
buffers=0
; bisecting (mode=d3d12): eval = everything but the DLSS-G evaluation, d3d12 = no D3D12 work or fences,
; present2 = only the first (generated) present
skip=

[cloth]
; Cloth simulation rate. game = engine default (fixed steps: 60 Hz near, 40/30/20 Hz for lower cloth
; LODs, not interpolated). render = every cloth advances at least once per rendered frame
; (never slower than the engine default; costs CPU in crowds). scale = multiply the engine intervals
; by `scale` (diagnostics). v1.62 only; the table is verified before patching.
mode=game
scale=1

[world]
; Draw distance multiplier for world geometry: objects stay drawn (at their detailed LODs) and are
; culled this many times further out (1 = game default, 2 = twice as far). LOD/proxy switch-in
; distances stay at the game's values, so nothing disappears before its replacement has streamed in.
lod_distance=1
; far = extend only the far end of LOD ranges (patched culling shaders; default). all = old behaviour,
; every range scaled (makes far proxies vanish near the camera, e.g. Alexandria's street planters).
lod_mode=far

; Ambient population: multiplies the engine's cap on systemically spawned characters (civilians,
; workers, animals; 200 in the game data, times 0.75-1.2 by Environment quality). Towns and cities
; normally sit at that cap. 1 = game default; 3-5 lifts the cap out of the way (~1.7x crowds in
; Alexandria; the rest is limited by spawn distance, see npc_distance). Game data only, nothing is
; saved; takes effect live within ~1 minute.
npc_density=1
; Spawn distance multiplier for ambient characters (MetaAI activation range and the spawn/despawn
; distance of the crowd spawn templates, 80 m in the game data). More of the city around you is
; populated, so the population rises further once npc_density has lifted the cap: in Alexandria
; npc_density=5 + npc_distance=2 gave ~2.6-3x the game's crowd. Rescans the game's data every
; 10 s in a background thread while active. Experimental: see docs/ENGINE_NOTES.md (NPC population).
npc_distance=1
; EXPERIMENT (default off): extra MetaAI units, i.e. more people near you rather than a higher cap.
; k = units per original unit in each civilian spawner the player approaches (1 = off, max 16).
; Calls the game's own unit-creation code from its MetaAI update; see src/world/npc_units.h.
; npc_units is the multiplier for civilians in towns and cities; the two below cover the rest. Each
; extra copies a random civilian of the same spawner (its look and its spot, a few metres off).
npc_units=1
; Civilians away from towns (farms, desert roads): their places have fewer than npc_urban_threshold
; original units within ~150 m (Alexandria / Memphis ~500-1000, Siwa's centre ~350, farmland ~50).
npc_units_rural=2
npc_urban_threshold=300
; Soldiers, guards, bandits and other combat factions (more of them changes the fights): 1 = vanilla.
npc_units_hostile=1
; Memory: the game keeps the memory of the most characters ever spawned at once (~0.9 MB each;
; +1.3 GB at npc_units=8 over Alexandria), and stalls for seconds when the computer runs short of
; memory. Below this many MB of free memory the crowd stops growing past its peak so far (until 1 GB
; more is free). 0 = off.
npc_mem_floor=3072
; Senu: while you fly the eagle the game spawns people under her, across the whole city (2000 ->
; 3000+ characters at npc_units=8, about 9 us of frame time each). If flying gets slow, set the most
; characters spawned while the camera is away from Bayek (e.g. 2400; the farthest go first). 0 = no limit.
npc_senu_max=0
; The game takes one Windows TLS index per animated character (an engine lock in each animation
; instance) and freezes once the process runs out of them (~1000 characters at once). 1 = hand the
; game extra "virtual" TLS indices once the real ones run low (swaps four TLS entries of Wine
; kernel32's import table; no code is changed). With 0, npc_density is held below that limit.
tls_extend=1

[stereo]
; Stereoscopic 3D (experimental): both eyes drawn from the same game frame, side by side (the frame
; is drawn a second time for the right eye: roughly half the frame rate). Frame Generation is off
; while this is set. off = normal 2D | sbs = always | auto = when the game's display is a HypXRland
; side-by-side stereo output (XREAL glasses in 3D mode), else 2D.
mode=off
; How the two eyes are packed (read when the game creates its window's swapchain):
;   hsbs = in the window's own size, each eye squeezed to half width (HypXRland stretches each
;          half back; works with any Proton). The window is tagged stereo-hsbs for HypXRland.
;   sbs  = a swapchain twice the window's width, each eye at full resolution (tag stereo-sbs).
;          Full resolution also needs a Proton whose DXVK creates a Vulkan swapchain larger than
;          the window; with stock DXVK it is scaled down to the window (same as hsbs, filtered).
;   auto = hsbs.
output=auto
; Eye offset from the centre, in mm (each eye; 32.5 = 65 mm between the eyes).
separation=32.5
; Distance in metres that appears at screen depth (closer comes out of the screen). 0 = parallel.
convergence=4
; Debug views (hsbs only): sbs | left | right | diff (|left - right| x diff_gain).
show=sbs
diff_gain=16
; 1 = exchange the eyes (cross-eyed viewing).
swap=0
; Debugging: kinds of camera copies shifted per eye in effect constant buffers (vp = view-projections,
; ss2ws = screen-to-world matrices, pos = camera positions).
copies=vp,ss2ws,pos
; Debugging: kinds of recorded calls left out of the replay (draw, dispatch, copy, clear, upload, execute).
skip=
