[[page]]
id = "valhalla"
title = "Valhalla"
options = ["stereo.cursor", "stereo.markers", "stereo.aim_eye", "upscaler.preset"]

[option."stereo.cursor"]
type = "enum"
label = "Map and menu cursor"
values = [{value="game", label="Game cursor"}, {value="depth", label="Follow the surface"}]
help = "Places the mouse pointer on the visible map or control and the controller’s map ring at the terrain depth."
apply = "live"

[option."stereo.markers"]
type = "bool"
label = "World marker and aiming depth"
help = "Places bow reticles and Synin’s scanning ring on the aimed surface and the tracked location diamonds at the target or first obstruction."
apply = "live"

[option."stereo.aim_eye"]
type = "enum"
label = "Predator Bow aiming eye"
values = [{value="left", label="Left eye"}, {value="right", label="Right eye"}, {value="center", label="Centred"}]
help = "Lines up the first-person sight with the selected eye. The opposite eye keeps the binocular separation."
apply = "live"

[option."upscaler.preset"]
type = "enum"
label = "DLSS model preset"
values = [{value="default", label="Driver default"}, {value="K", label="K"}, {value="L", label="L"}, {value="M", label="M"}]
apply = "live"
